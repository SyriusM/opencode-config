name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: shellcheck
        run: shellcheck -S warning install.sh tests/e2e.sh tests/plugins/run.sh

      - name: plugin syntax (esbuild)
        run: for f in plugins/*/index.ts; do npx -y esbuild "$f" --log-level=error --outfile=/dev/null || exit 1; done

      - name: Python script syntax
        run: for f in bin/lesson-note bin/palace-context bin/freecode-tune freecode/freecode freecode/rebrand tests/mock_llm.py; do python3 -c "import ast, sys; ast.parse(open(sys.argv[1]).read())" "$f" || exit 1; done

      - name: plugin behaviour tests
        run: tests/plugins/run.sh

      - name: opencode 2.0.24
        run: npm i -g @opencode/cli@2.0.24 && opencode --version

      - name: install, session on a mock model, uninstall
        run: tests/e2e.sh
