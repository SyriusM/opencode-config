name: test

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: shellcheck
        run: shellcheck -S warning install.sh tests/e2e.sh

      - name: składnia wtyczek (esbuild)
        run: for f in plugins/*/index.ts; do npx -y esbuild "$f" --log-level=error --outfile=/dev/null || exit 1; done

      - name: składnia skryptów Pythona
        run: for f in bin/oc-wniosek bin/palace-kontekst tests/atrapa.py; do python3 -m py_compile "$f" || exit 1; done

      - name: opencode 2.0.24
        run: npm i -g @opencode/cli@2.0.24 && opencode --version

      - name: instalacja, sesja na atrapie modelu, deinstalacja
        run: tests/e2e.sh
